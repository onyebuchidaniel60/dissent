[package]
name = "dissent-registry"
version = "0.1.0"
edition = "2021"
description = "Dissent testnet commitment, certificate and bounty registry"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
